{% extends 'base.html' %}
{% load custom_filters %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Loan Application Settings</h4>
            </div>
            <div class="card-body">
                <div class="mb-3 text-end">
                    <a href="{% url 'admin_loan_settings_history' %}" class="btn btn-outline-secondary btn-sm">View Settings History</a>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Application Start Date</label>
                        <input type="date" name="start_date" value="{{ settings.start_date|date:'Y-m-d' }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Application End Date</label>
                        <input type="date" name="end_date" value="{{ settings.end_date|date:'Y-m-d' }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Default Interest Rate (%)</label>
                        <input type="number" step="0.5" name="default_interest_rate" value="{{ settings.default_interest_rate }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Default Loan Duration (months)</label>
                        <input type="number" name="default_loan_duration_months" value="{{ settings.default_loan_duration_months }}" class="form-control" required>
                    </div>
                    <hr>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="penalty_enabled" name="penalty_enabled" {% if settings.penalty_enabled %}checked{% endif %}>
                        <label class="form-check-label" for="penalty_enabled">Enable penalty / late fee settings</label>
                    </div>
                    <div class="mb-3">
                        <label>Grace Days</label>
                        <input type="number" name="grace_days" value="{{ settings.grace_days }}" class="form-control" min="0">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="enable_late_fee_per_day" name="enable_late_fee_per_day" {% if settings.enable_late_fee_per_day %}checked{% endif %}>
                        <label class="form-check-label" for="enable_late_fee_per_day">Enable late fee per day</label>
                    </div>
                    <div class="mb-3">
                        <label>Late Fee Per Day</label>
                        <input type="number" step="0.01" name="late_fee_per_day" value="{{ settings.late_fee_per_day }}" class="form-control" min="0">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="enable_fixed_penalty" name="enable_fixed_penalty" {% if settings.enable_fixed_penalty %}checked{% endif %}>
                        <label class="form-check-label" for="enable_fixed_penalty">Enable fixed penalty amount</label>
                    </div>
                    <div class="mb-3">
                        <label>Fixed Penalty Amount</label>
                        <input type="number" step="0.01" name="fixed_penalty_amount" value="{{ settings.fixed_penalty_amount }}" class="form-control" min="0">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="enable_percentage_penalty" name="enable_percentage_penalty" {% if settings.enable_percentage_penalty %}checked{% endif %}>
                        <label class="form-check-label" for="enable_percentage_penalty">Enable percentage penalty (%)</label>
                    </div>
                    <div class="mb-3">
                        <label>Percentage Penalty Rate</label>
                        <input type="number" step="0.01" name="percentage_penalty_rate" value="{{ settings.percentage_penalty_rate }}" class="form-control" min="0">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const penaltyEnabled = document.getElementById('penalty_enabled');
        const lateFee = document.getElementById('enable_late_fee_per_day');
        const fixedPenalty = document.getElementById('enable_fixed_penalty');
        const percentagePenalty = document.getElementById('enable_percentage_penalty');

        function syncPenaltyCheckboxes(changed) {
            if (!changed.checked) {
                return;
            }
            [lateFee, fixedPenalty, percentagePenalty].forEach(function (checkbox) {
                if (checkbox !== changed && checkbox) {
                    checkbox.checked = false;
                }
            });
        }

        if (penaltyEnabled) {
            penaltyEnabled.addEventListener('change', function () {
                if (!this.checked) {
                    if (lateFee) lateFee.checked = false;
                    if (fixedPenalty) fixedPenalty.checked = false;
                    if (percentagePenalty) percentagePenalty.checked = false;
                }
            });
        }

        [lateFee, fixedPenalty, percentagePenalty].forEach(function (checkbox) {
            if (checkbox) {
                checkbox.addEventListener('change', function () {
                    if (this.checked) {
                        syncPenaltyCheckboxes(this);
                    }
                });
            }
        });
    });
</script>
{% endblock %}
