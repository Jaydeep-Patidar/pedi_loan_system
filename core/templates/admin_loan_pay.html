{% extends 'base.html' %}

{% block title %}Admin Loan Payment{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Record Loan Payment</h4>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <strong>Member:</strong> {{ loan.member.user.get_full_name }}
                    </div>
                    <div class="mb-3">
                        <strong>Loan Amount:</strong> ₹{{ loan.amount }}
                    </div>
                    <div class="mb-3">
                        <strong>Remaining Due:</strong> ₹{{ loan.remaining_due }}
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="amount" class="form-label">Payment Amount</label>
                            <input type="number" class="form-control" id="amount" name="amount"
                                   min="0.01" max="{{ loan.remaining_due }}" step="0.01" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Record Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
