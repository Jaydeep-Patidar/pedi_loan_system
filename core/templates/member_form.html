{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>{{ title }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'member_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
                {% if member_obj and not member_obj.is_active %}
                <form method="post" action="{% url 'member_activate' member_obj.id %}" style="display:inline; margin-top:10px;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-success">Activate Member</button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
